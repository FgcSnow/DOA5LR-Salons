[ReplayTakeover]
; Enabled=0 : desactive le module sans le retirer / disables the mod without removing it
Enabled=1
; Retour de secours accelere : 1 = une image sur 8 affichee (plus rapide) / fallback fast-forward: 1 = show 1 frame in 8 (faster)
SkipPresent=1
; ChoixJoueur=1 : fenetre P1/P2 si les deux joueurs sont humains / P1/P2 window when both players are human
ChoixJoueur=1
; Codes des boutons (manette PlayStation) / button codes (PlayStation pad) :
;   L2=0x4000 R2=0x8000 Select=0x200 Start=0x100 L3=0x400 Carre/Square=0x40 ; 0 = aucun / none
; BoutonPrise : pendant le replay, prendre la main / during the replay, take control
BoutonPrise=0x4000
; BoutonRetour : pendant la reprise, revenir au point et garder la main / while in control, go back and keep control
BoutonRetour=0x200
; BoutonRendre : pendant la reprise, revenir au point et rendre la main / while in control, go back and give control back
BoutonRendre=0x100
; BoutonRetourExact : pendant la reprise, retour avec le decor remis a neuf / while in control, go back with the stage rebuilt
BoutonRetourExact=0x400
; PasRattrapage : retour de secours, pas de simulation par image affichee (1 a 16) / fallback, simulation steps per frame (1-16)
PasRattrapage=10
; JournalBoutons=1 : note chaque bouton dans DOA5LR-ReplayTakeover.log / logs every button press
JournalBoutons=0
