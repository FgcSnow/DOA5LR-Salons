[JoinFix]
; DOA5LR-JoinFix 0.2 - room join fixes. 1 = on, 0 = off.
; KeyFix: when YOU create a room, the game publishes its network encryption key as text. If a random byte of
;   the key is 0, Steam cuts the key and nobody can join your room (they enter, then leave after 30 s).
;   KeyFix repairs the key before it is published. This is the main fix: keep it on.
KeyFix=1
; AcceptMembers: always accept the network link of players who are in your room.
AcceptMembers=1
; InviteRetry: after you accept an invite, ask Steam again for the room data if it does not arrive (every 3 s, 5 times max).
InviteRetry=1
; FastFail: while joining, if Steam reports that the host cannot be reached, stop at once with the game's error
;   message instead of waiting up to 90 s. Off by default (not yet seen in real use).
FastFail=0
