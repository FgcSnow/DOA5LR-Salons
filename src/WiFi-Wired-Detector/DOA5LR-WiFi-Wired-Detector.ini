[NetBoost]
; 0 = statistiques seules ; 1..3 = nombre de paquets precedents embarques dans chaque envoi
; (actif uniquement si l adversaire a aussi le plugin, detection automatique)
Redundancy=0
; 1 = normal ; 0 = demander a Steam une connexion directe (sans relais) - test
AllowRelay=1
; 1 = journaliser chaque paquet (verbeux)
LogPackets=0
PacketLogMax=3000
; type de connexion affiche dans le salon : 0 = automatique (cable/Wi-Fi detecte), 1 = forcer cable [n], 2 = forcer sans fil <n>
LinkOverride=0
; 0.8.6 : ping reel affiche dans le salon pour les joueurs equipes : 0 = non, 1 = " 45ms" ajoute au nom du joueur dans sa fiche, 2 = ecrit dans le chiffre de qualite
PingDisplay=1
; 1 = aussi sur sa propre fiche (test seul dans un salon : ping vers soi ~15 ms). Laisser 0 : les autres verraient ce chiffre dans votre nom.
PingDisplaySelf=0
; 1 = journaliser les cles/valeurs du salon Steam (diagnostic)
LobbyProbe=0
