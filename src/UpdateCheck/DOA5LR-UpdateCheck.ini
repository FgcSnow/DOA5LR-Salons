[UpdateCheck]
; DOA5LR-UpdateCheck 1.0 - reads ONE public text file (version.txt on GitHub) a few seconds after the game starts,
; compares it with DOA5LR-Salons-VERSION.txt, and when you close the game starts DOA5LR-Salons-Installer.exe --update
; if a newer pack exists ("Update now / Later"). It sends nothing, writes no file, does nothing in-game.
; 1 = enabled, 0 = never check
Enabled=1
; 1 = open the installer after the game closes when a newer pack exists ; 0 = check only (the installer shows it anyway)
UpdatePrompt=1
; seconds after game start before the check (network is idle then)
DelaySeconds=20
; where version.txt lives (https only). Leave as is.
VersionUrl=https://raw.githubusercontent.com/FgcSnow/DOA5LR-Salons/main/version.txt
