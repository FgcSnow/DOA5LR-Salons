[NetBoost]
; 0 = statistiques seules ; 1..3 = nombre de paquets precedents embarques dans chaque envoi
; (actif uniquement si l adversaire a aussi le plugin, detection automatique)
Redundancy=0
; 1 = normal ; 0 = demander a Steam une connexion directe (sans relais) - test
AllowRelay=1
; 1 = journaliser chaque paquet (verbeux)
LogPackets=0
PacketLogMax=3000
; type de connexion affiche dans le salon : 0 = automatique (cable/Wi-Fi detecte), 2 = forcer sans fil <n>
; (0.8.8 : forcer cable n'existe plus - toute autre valeur = automatique)
LinkOverride=0
; 1 = journaliser les cles/valeurs du salon Steam (diagnostic)
LobbyProbe=0
