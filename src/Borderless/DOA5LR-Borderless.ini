[Borderless]
; 2 = borderless fullscreen (default): the plugin sets SCREEN_TYPE=WINDOW in Documents\KoeiTecmo\DOA5LR\DOA5LR.ini
;     when the game starts, then removes the window borders and fits the window to the monitor.
;     You do NOT need to pick "Window" in the game options any more.
; 1 = classic window forced (borders kept)
; 0 = plugin off: the game's own Fullscreen/Window setting applies
Mode=2
; key that cycles the mode in game: Borderless (1 beep) -> Window (2 beeps) -> Fullscreen (3 beeps, applied at next launch) -> ...
; F1..F24, a virtual-key code, or 0 = disabled. The choice is saved here.
ToggleKey=F11
